name: Native quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          packages: deps::.
          dependencies: '"hard"'
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-21 clang-format-21 clang-tidy-21 shellcheck valgrind
      - name: Check native sources
        env:
          CLANGXX: clang++-21
          CLANG_FORMAT: clang-format-21
          CLANG_TIDY: clang-tidy-21
        run: |
          shellcheck tools/native-quality.sh
          tools/native-quality.sh
      - name: Run installed package under Valgrind
        run: |
          R CMD INSTALL .
          R -d 'valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite' \
            --vanilla --no-echo -f tools/valgrind-hammer.R

  sanitizer:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['address,undefined', thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the production router
        env:
          SANITIZER: ${{ matrix.sanitizer }}
          UBSAN_OPTIONS: halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          g++ -std=c++17 -Isrc -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize="$SANITIZER" tools/check-hammer.cpp -o "$RUNNER_TEMP/check-hammer"
          "$RUNNER_TEMP/check-hammer"
